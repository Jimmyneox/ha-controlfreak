<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Freak strategy harness</title>
<!--
  Render check for the dashboard strategy. Serve the repository root over HTTP
  and open tests/frontend/harness.html?shape=full-pool. The page runs the REAL
  strategy module against a hass stub fixture and draws the generated config
  with simplified stand-ins for the core cards (heading, tile + features,
  markdown) and the REAL picture card (custom:controlfreak-picture) for the
  animated pictures. It checks structure and layout, not Home Assistant's own
  styling. ?shape=pictures renders the full pool plus a gallery of every scene
  by day and by night. body[data-rendered] becomes "true" once every picture
  has drawn a frame, "error" on any script error or console.error.
-->
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1c1c1e; --muted: #6b6f76; --line: #e2e4e8;
          --on: #ff9800; --accent: #03a9f4; --chip: #eef1f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--card);
           display: flex; gap: 12px; align-items: baseline; }
  header h1 { font-size: 20px; margin: 0; }
  header span { color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
         gap: 16px; padding: 16px 24px; align-items: start; }
  .section { display: grid; gap: 8px; }
  .heading { display: flex; gap: 8px; align-items: center; font-size: 18px; font-weight: 600;
             padding: 4px 4px 2px; }
  .heading .mdi { color: var(--muted); font-size: 12px; font-weight: 400; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
          background: var(--chip); color: var(--muted); font-weight: 700; flex: none; }
  .icon.on { background: #fff3e0; color: var(--on); }
  .name { font-weight: 600; }
  .state { color: var(--muted); font-size: 12px; }
  .features { display: grid; gap: 6px; margin-top: 8px; }
  .feature { background: var(--chip); border-radius: 8px; padding: 6px 8px; font-size: 12px;
             display: flex; justify-content: space-between; gap: 8px; }
  .feature b { color: var(--accent); font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .tap { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .markdown { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; white-space: pre-wrap; }
  .picture { height: 220px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .picture controlfreak-picture { display: block; height: 100%; }
  .gallery { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
  .gallery .heading { grid-column: 1 / -1; }
  .sized .picture { height: auto; }
  .caption { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .night { background: #0a1a24; color: #e4f2f5; border-radius: 12px; padding: 8px; }
  .night .caption { color: #93abb3; }
  .error { grid-column: 1 / -1; background: #fde8e8; color: #8a1c1c; padding: 12px; border-radius: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header><h1 id="title"></h1><span id="meta"></span></header>
<main id="view"></main>
<script>
  // Any script error or console.error fails the render check (see the end of the module).
  window.__harnessErrors = [];
  addEventListener("error", (e) => window.__harnessErrors.push(e.message));
  addEventListener("unhandledrejection", (e) => window.__harnessErrors.push(String(e.reason)));
  const origError = console.error.bind(console);
  console.error = (...args) => { window.__harnessErrors.push(args.join(" ")); origError(...args); };
</script>
<script type="module">
  import { buildDashboard } from "../../custom_components/controlfreak/frontend/controlfreak-strategy.js";
  import { SCENES, SHAPE_NAMES } from "../../custom_components/controlfreak/frontend/controlfreak-picture.js";

  const params = new URLSearchParams(location.search);
  const shape = params.get("shape") ?? "full-pool";
  const options = JSON.parse(params.get("options") ?? "{}");
  // "pictures" is the full pool plus a gallery of every scene, day and night.
  const fixtureName = shape === "pictures" ? "full-pool" : shape;
  const hass = await (await fetch(`./fixtures/${fixtureName}.json`)).json();
  const dashboard = buildDashboard(hass, options);
  const view = dashboard.views[0];

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  function featureEl(feature, st) {
    const f = el("div", "feature");
    const a = st.attributes ?? {};
    switch (feature.type) {
      case "fan-speed": {
        f.append(el("span", "", "Speed"), el("b", "", `${a.percentage ?? 0} %`));
        const wrap = el("div"); wrap.append(f);
        const bar = el("div", "bar"); const fill = el("i"); fill.style.width = `${a.percentage ?? 0}%`;
        bar.append(fill); wrap.append(bar); return wrap;
      }
      case "select-options":
        f.append(el("span", "", (a.options ?? []).join(" · ")), el("b", "", st.state)); return f;
      case "fan-preset-modes":
        f.append(el("span", "", (a.preset_modes ?? []).join(" · ")), el("b", "", a.preset_mode ?? "")); return f;
      case "light-effect":
        f.append(el("span", "", `Effect (${(a.effect_list ?? []).length})`), el("b", "", a.effect ?? "—")); return f;
      case "trend-graph":
        f.append(el("span", "", "24 h trend"), el("b", "", "∿")); return f;
      default:
        f.append(el("span", "", feature.type)); return f;
    }
  }

  function pictureEl(card, hassFor) {
    const wrap = el("div", "picture");
    const pic = document.createElement("controlfreak-picture");
    pic.setConfig(card);
    pic.hass = hassFor;
    wrap.append(pic);
    return wrap;
  }

  function cardEl(card) {
    if (card.type === "custom:controlfreak-picture") return pictureEl(card, hass);
    if (card.type === "heading") {
      const h = el("div", "heading", card.heading);
      if (card.icon) h.append(el("span", "mdi", card.icon));
      return h;
    }
    if (card.type === "markdown") return el("div", "markdown", card.content.replace(/\*\*/g, ""));
    const st = hass.states[card.entity] ?? { state: "missing", attributes: {} };
    const t = el("div", "tile");
    const row = el("div", "row");
    const on = ["on", "open"].includes(st.state);
    const domain = card.entity.split(".")[0];
    row.append(el("div", `icon${on ? " on" : ""}`, domain[0].toUpperCase()));
    const label = el("div");
    const unit = st.attributes?.unit_of_measurement ? ` ${st.attributes.unit_of_measurement}` : "";
    label.append(
      // Like the tile card: the configured name, else the full friendly name.
      el("div", "name", card.name ?? st.attributes?.friendly_name ?? card.entity),
      el("div", "state", `${st.state}${unit} · ${card.entity}`)
    );
    row.append(label);
    t.append(row);
    if (card.features?.length) {
      const fs = el("div", "features");
      for (const f of card.features) fs.append(featureEl(f, st));
      t.append(fs);
    }
    if (card.icon_tap_action) t.append(el("div", "tap", `icon tap: ${card.icon_tap_action.action} (read-only)`));
    return t;
  }

  document.getElementById("title").textContent = dashboard.title;
  const nTiles = view.sections.flatMap((s) => s.cards).filter((c) => c.type === "tile").length;
  document.getElementById("meta").textContent =
    `shape: ${shape} · ${view.sections.length} section(s) · ${nTiles} tile(s)`;
  const main = document.getElementById("view");
  for (const section of view.sections) {
    const s = el("div", "section");
    for (const card of section.cards) s.append(cardEl(card));
    main.append(s);
  }

  if (shape === "pictures") {
    // Every scene with its pump running and its light on, by day and by night.
    // Entities are synthetic: the full-pool fixture has no deck jets or bubbler.
    const demo = {
      states: {
        "fan.demo_pump": { state: "on", attributes: { percentage: 60 } },
        "sensor.demo_mode": { state: "spillover", attributes: {} },
        "light.demo_blue": { state: "on", attributes: { effect: "Blue" } },
        "light.demo_magenta": { state: "on", attributes: { effect: "Magenta" } },
        "light.demo_white": { state: "on", attributes: { effect: "White" } },
        "light.demo_green": { state: "on", attributes: { effect: "Green" } },
        "light.demo_show": { state: "on", attributes: { effect: "Party Mode" } },
      },
    };
    const lights = ["light.demo_blue", "light.demo_magenta", "light.demo_white", "light.demo_green", "light.demo_show"];
    for (const dark of [false, true]) {
      const g = el("div", `gallery${dark ? " night" : ""}`);
      g.append(el("div", "heading", dark ? "Every scene at night" : "Every scene by day"));
      SCENES.forEach((scene, i) => {
        const card = { type: "custom:controlfreak-picture", scene, pump: "fan.demo_pump", light: lights[i] };
        if (scene === "spa") card.spillover = "sensor.demo_mode";
        const cell = el("div");
        cell.append(pictureEl(card, { ...demo, themes: { darkMode: dark } }));
        cell.append(el("div", "caption", `${scene} · pump 60% · ${demo.states[lights[i]].attributes.effect}`));
        g.append(cell);
      });
      main.append(g);
    }
    // Every pool outline, by day, pump running and light on; "custom" is a hexagon.
    const g = el("div", "gallery shapes");
    g.append(el("div", "heading", "Every pool shape"));
    for (const shape of SHAPE_NAMES) {
      const card = { type: "custom:controlfreak-picture", scene: "pool", shape, pump: "fan.demo_pump", light: "light.demo_blue" };
      if (shape === "custom") card.path = "M0.25 0.04 H0.75 L0.96 0.5 L0.75 0.96 H0.25 L0.04 0.5 Z";
      const cell = el("div");
      cell.append(pictureEl(card, { ...demo, themes: { darkMode: false } }));
      cell.append(el("div", "caption", `pool · ${shape}`));
      g.append(cell);
    }
    main.append(g);
    // A short and a tall picture: the height follows the card's rows / height.
    const sizes = el("div", "gallery sizes");
    sizes.append(el("div", "heading", "Sizes: height 140px and aspect ratio 21:9"));
    for (const cfg of [{ height: 140 }, { aspect_ratio: "21:9" }]) {
      const cell = el("div", "sized");
      cell.append(pictureEl({ type: "custom:controlfreak-picture", scene: "pool", shape: "roman", ...cfg }, demo));
      cell.append(el("div", "caption", JSON.stringify(cfg)));
      sizes.append(cell);
    }
    main.append(sizes);
  }

  // Ready once every picture has drawn a frame (ResizeObserver fires after layout).
  const pics = [...document.querySelectorAll("controlfreak-picture")];
  const deadline = performance.now() + 8000;
  while (pics.some((p) => p.frames === 0) && performance.now() < deadline) {
    await new Promise((r) => requestAnimationFrame(r));
  }
  await new Promise((r) => requestAnimationFrame(r));
  const undrawn = pics.filter((p) => p.frames === 0).length;
  if (undrawn) window.__harnessErrors.push(`${undrawn} picture card(s) never drew a frame`);
  if (window.__harnessErrors.length) {
    main.append(el("div", "error", window.__harnessErrors.join("\n")));
    document.body.dataset.rendered = "error";
  } else {
    document.body.dataset.rendered = "true";
  }
</script>
</body>
</html>
