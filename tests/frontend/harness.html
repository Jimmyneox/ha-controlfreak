<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Freak strategy harness</title>
<!--
  Render check for the dashboard strategy. Serve the repository root over HTTP
  and open tests/frontend/harness.html?shape=full-pool. The page runs the REAL
  strategy module against a hass stub fixture and draws the generated config
  with simplified stand-ins for the core cards (heading, tile + features,
  markdown) and the REAL picture card (custom:controlfreak-picture) for the
  animated pictures. It checks structure and layout, not Home Assistant's own
  styling. ?shape=pictures renders the full pool plus a gallery of every scene
  by day and by night. ?shape=styles-day and ?shape=styles-night render the
  contact sheet: every picture style (rows) by every scene (columns), one
  page per time of day. ?shape=shapes-day and ?shape=shapes-night do the same
  for the overview: styles down, pool shapes across, every part running. body[data-rendered] becomes "true" once every picture
  has drawn a frame, "error" on any script error or console.error.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1c1c1e; --muted: #6b6f76; --line: #e2e4e8;
          --on: #ff9800; --accent: #03a9f4; --chip: #eef1f5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--card);
           display: flex; gap: 12px; align-items: baseline; }
  header h1 { font-size: 20px; margin: 0; }
  header span { color: var(--muted); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
         gap: 16px; padding: 16px 24px; align-items: start; }
  .section { display: grid; gap: 8px; }
  .heading { display: flex; gap: 8px; align-items: center; font-size: 18px; font-weight: 600;
             padding: 4px 4px 2px; }
  .heading .mdi { color: var(--muted); font-size: 12px; font-weight: 400; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .icon .mdi { font-size: 22px; line-height: 1; }
  .heading .mdi.mdi-icon { font-size: 18px; vertical-align: -3px; margin-left: 6px; }
  .icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
          background: var(--chip); color: var(--muted); font-weight: 700; flex: none; }
  .icon.on { background: #fff3e0; color: var(--on); }
  .name { font-weight: 600; }
  .state { color: var(--muted); font-size: 12px; }
  .features { display: grid; gap: 6px; margin-top: 8px; }
  .feature { background: var(--chip); border-radius: 8px; padding: 6px 8px; font-size: 12px;
             display: flex; justify-content: space-between; gap: 8px; }
  .feature b { color: var(--accent); font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .tap { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .markdown { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; white-space: pre-wrap; }
  .picture { height: 220px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .picture controlfreak-picture { display: block; height: 100%; }
  .gallery { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
  .gallery .heading { grid-column: 1 / -1; }
  .caption { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .night { background: #0a1a24; color: #e4f2f5; border-radius: 12px; padding: 8px; }
  .night .caption { color: #93abb3; }
  .sheet { grid-column: 1 / -1; display: grid; grid-template-columns: 110px repeat(5, 1fr); gap: 10px; align-items: center; }
  .sheet.shapes { grid-template-columns: 110px repeat(6, 1fr); }
  .sheet .picture { height: 150px; --controlfreak-picture-height: 150px; }
  .sheet.shapes .picture { height: 170px; --controlfreak-picture-height: 170px; }
  .sheet.decks { grid-template-columns: 110px repeat(5, 1fr); }
  .sheet.decks .picture { height: 170px; --controlfreak-picture-height: 170px; }
  .feature-host { --feature-height: 42px; --feature-border-radius: 12px; --feature-button-spacing: 12px; --primary-color: #03a9f4; margin-top: 8px; }
  .icons { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .iconcell { background: var(--card); border-radius: 12px; padding: 14px; display: grid; gap: 10px; justify-items: center; }
  .iconcell .big { color: #1f2a33; }
  .iconcell .small { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .sheet .rowlabel { font-weight: 600; font-size: 15px; }
  .sheet .rowlabel small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .sheet .collabel { text-align: center; font-size: 12px; color: var(--muted); }
  .night.sheet { background: #0a1a24; color: #e4f2f5; }
  .night .rowlabel small, .night .collabel { color: #93abb3; }
  .error { grid-column: 1 / -1; background: #fde8e8; color: #8a1c1c; padding: 12px; border-radius: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header><h1 id="title"></h1><span id="meta"></span></header>
<main id="view"></main>
<script>
  // Any script error or console.error fails the render check (see the end of the module).
  window.__harnessErrors = [];
  addEventListener("error", (e) => window.__harnessErrors.push(e.message));
  addEventListener("unhandledrejection", (e) => window.__harnessErrors.push(String(e.reason)));
  const origError = console.error.bind(console);
  console.error = (...args) => { window.__harnessErrors.push(args.join(" ")); origError(...args); };
</script>
<script type="module">
  import { buildDashboard } from "../../custom_components/controlfreak/frontend/controlfreak-strategy.js";
  import { SCENES } from "../../custom_components/controlfreak/frontend/controlfreak-picture.js";
  import { DECKS, DECK_LABELS, STYLES, STYLE_LABELS } from "../../custom_components/controlfreak/frontend/controlfreak-picture-styles.js";
  import "../../custom_components/controlfreak/frontend/controlfreak-features.js";
  import { ICON_NAMES, ICON_VIEW_BOX, iconPath } from "../../custom_components/controlfreak/frontend/controlfreak-icons.js";
  import { SHAPES, SHAPE_LABELS } from "../../custom_components/controlfreak/frontend/controlfreak-pool-shapes.js";

  const params = new URLSearchParams(location.search);
  const shape = params.get("shape") ?? "full-pool";
  const options = JSON.parse(params.get("options") ?? "{}");
  // "pictures" is the full pool plus a gallery of every scene, day and night.
  const sheet = shape === "styles-day" ? "day" : shape === "styles-night" ? "night" : null;
  const shapesSheet = shape === "shapes-day" ? "day" : shape === "shapes-night" ? "night" : null;
  const decksSheet = shape === "decks-day" ? "day" : shape === "decks-night" ? "night" : null;
  const iconsSheet = shape === "icons";
  const fixtureName = shape === "pictures" || sheet || shapesSheet || decksSheet || iconsSheet ? "full-pool" : shape;
  const hass = await (await fetch(`./fixtures/${fixtureName}.json`)).json();
  const dashboard = buildDashboard(hass, options);
  const view = dashboard.views[0];

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  function featureEl(feature, st, entityId) {
    const f = el("div", "feature");
    const a = st.attributes ?? {};
    if (feature.type.startsWith("custom:controlfreak-")) {
      // The real feature element, as the tile card would host it; service calls are logged.
      const fe = document.createElement(feature.type.slice("custom:".length));
      // Assigned in the order and with the properties hui-card-feature sets.
      fe.hass = { ...hass, callService: (d, s, data) => console.log("callService", d, s, JSON.stringify(data)) };
      fe.stateObj = st;
      fe.context = { entity_id: entityId };
      fe.color = undefined;
      fe.position = "bottom";
      fe.setConfig(feature);
      const wrap = el("div", "feature-host");
      wrap.append(fe);
      return wrap;
    }
    switch (feature.type) {
      case "fan-speed": {
        f.append(el("span", "", "Speed"), el("b", "", `${a.percentage ?? 0} %`));
        const wrap = el("div"); wrap.append(f);
        const bar = el("div", "bar"); const fill = el("i"); fill.style.width = `${a.percentage ?? 0}%`;
        bar.append(fill); wrap.append(bar); return wrap;
      }
      case "select-options":
        f.append(el("span", "", (a.options ?? []).join(" · ")), el("b", "", st.state)); return f;
      case "fan-preset-modes":
        f.append(el("span", "", (a.preset_modes ?? []).join(" · ")), el("b", "", a.preset_mode ?? "")); return f;
      case "light-effect":
        f.append(el("span", "", `Effect (${(a.effect_list ?? []).length})`), el("b", "", a.effect ?? "—")); return f;
      case "trend-graph":
        f.append(el("span", "", "24 h trend"), el("b", "", "∿")); return f;
      default:
        f.append(el("span", "", feature.type)); return f;
    }
  }

  // An icon as ha-state-icon would draw it: cf: from the Control Freak set, mdi: from the font.
  function iconEl(name, size = 24) {
    if (name.startsWith("cf:")) {
      const d = iconPath(name.slice(3));
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", ICON_VIEW_BOX);
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
      svg.style.display = "block";
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d ?? "");
      p.setAttribute("fill", "currentColor");
      svg.append(p);
      if (!d) svg.style.outline = "2px solid red";
      return svg;
    }
    const i = el("i", `mdi ${name.replace("mdi:", "mdi-")}`);
    i.style.fontSize = `${size}px`;
    return i;
  }

  function pictureEl(card, hassFor) {
    const wrap = el("div", "picture");
    const pic = document.createElement("controlfreak-picture");
    pic.setConfig(card);
    pic.hass = hassFor;
    wrap.append(pic);
    return wrap;
  }

  function cardEl(card) {
    if (card.type === "custom:controlfreak-picture") return pictureEl(card, hass);
    if (card.type === "heading") {
      const h = el("div", "heading", card.heading);
      if (card.icon) h.append(el("span", `mdi mdi-icon ${card.icon.replace("mdi:", "mdi-")}`));
      return h;
    }
    if (card.type === "markdown") return el("div", "markdown", card.content.replace(/\*\*/g, ""));
    const st = hass.states[card.entity] ?? { state: "missing", attributes: {} };
    const t = el("div", "tile");
    const row = el("div", "row");
    const on = ["on", "open"].includes(st.state);
    const domain = card.entity.split(".")[0];
    // The entity's own icon, as the tile card shows it; a domain default when it has none.
    const DOMAIN_ICONS = { fan: "mdi:fan", light: "mdi:lightbulb", switch: "mdi:toggle-switch", sensor: "mdi:eye", binary_sensor: "mdi:radiobox-blank" };
    const iconName = st.attributes?.icon ?? (st.attributes?.device_class === "temperature" ? "mdi:thermometer" : st.attributes?.device_class === "connectivity" ? "mdi:lan-connect" : DOMAIN_ICONS[domain] ?? "mdi:help");
    const ic = el("div", `icon${on ? " on" : ""}`);
    ic.append(iconEl(iconName));
    ic.title = iconName;
    row.append(ic);
    const label = el("div");
    // Like the tile card: the configured name, else the full friendly name.
    // No status line under it: the icon colour and the features carry the state.
    label.append(el("div", "name", card.name ?? st.attributes?.friendly_name ?? card.entity));
    row.append(label);
    t.append(row);
    if (card.features?.length) {
      const fs = el("div", "features");
      for (const f of card.features) fs.append(featureEl(f, st, card.entity));
      t.append(fs);
    }
    if (card.icon_tap_action) t.append(el("div", "tap", `icon tap: ${card.icon_tap_action.action} (read-only)`));
    return t;
  }

  document.getElementById("title").textContent = dashboard.title;
  const nTiles = view.sections.flatMap((s) => s.cards).filter((c) => c.type === "tile").length;
  document.getElementById("meta").textContent =
    `shape: ${shape} · ${view.sections.length} section(s) · ${nTiles} tile(s)`;
  const main = document.getElementById("view");
  if (iconsSheet) {
    // The icon set, each glyph at tile size and large, for review.
    const g = el("div", "icons");
    for (const name of ICON_NAMES) {
      const cell = el("div", "iconcell");
      const big = el("div", "big"); big.append(iconEl(`cf:${name}`, 72));
      const disc = el("div", "icon on"); disc.append(iconEl(`cf:${name}`));
      const row = el("div", "small"); row.append(disc, el("span", "", `cf:${name}`));
      cell.append(big, row);
      g.append(cell);
    }
    main.append(g);
    document.getElementById("meta").textContent = `shape: icons · ${ICON_NAMES.length} icons`;
  }

  if (!sheet && !shapesSheet && !decksSheet && !iconsSheet) {
    for (const section of view.sections) {
      const s = el("div", "section");
      for (const card of section.cards) s.append(cardEl(card));
      main.append(s);
    }
  }

  // Every scene with its pump running and its light on. Entities are synthetic:
  // the full-pool fixture has no deck jets or bubbler.
  const demo = {
      states: {
        "fan.demo_pump": { state: "on", attributes: { percentage: 60 } },
        "sensor.demo_mode": { state: "spillover", attributes: {} },
        "light.demo_blue": { state: "on", attributes: { effect: "Blue" } },
        "light.demo_magenta": { state: "on", attributes: { effect: "Magenta" } },
        "light.demo_white": { state: "on", attributes: { effect: "White" } },
        "light.demo_green": { state: "on", attributes: { effect: "Green" } },
        "light.demo_show": { state: "on", attributes: { effect: "Party Mode" } },
      },
    };
  const lights = ["light.demo_blue", "light.demo_magenta", "light.demo_white", "light.demo_green", "light.demo_show"];
  const STYLE_NOTES = {
    caustic: "soft caustic water",
    blueprint: "flat plan view, ink lines",
    depth: "refracted tiles, glints",
    neon: "dark mirror, glowing lights",
    poster: "flat colours, paper grain",
  };
  if (sheet) {
    // The contact sheet: styles down, scenes across, one time of day per page.
    const dark = sheet === "night";
    const g = el("div", `sheet${dark ? " night" : ""}`);
    g.append(el("div", "collabel", dark ? "night" : "day"));
    SCENES.forEach((scene, i) => g.append(el("div", "collabel", `${scene} · pump 60% · ${demo.states[lights[i]].attributes.effect}`)));
    for (const style of STYLES) {
      const label = el("div", "rowlabel", STYLE_LABELS[style]);
      label.append(el("small", "", STYLE_NOTES[style]));
      g.append(label);
      SCENES.forEach((scene, i) => {
        const card = { type: "custom:controlfreak-picture", scene, style, pump: "fan.demo_pump", light: lights[i] };
        if (scene === "spa") card.spillover = "sensor.demo_mode";
        g.append(pictureEl(card, { ...demo, themes: { darkMode: dark } }));
      });
    }
    main.append(g);
    document.getElementById("meta").textContent = `shape: ${shape} · ${STYLES.length} styles × ${SCENES.length} scenes`;
  }

  if (shapesSheet) {
    // The overview contact sheet: styles down, shapes across, every part running.
    const dark = shapesSheet === "night";
    const g = el("div", `sheet shapes${dark ? " night" : ""}`);
    g.append(el("div", "collabel", dark ? "night" : "day"));
    for (const sh of SHAPES) g.append(el("div", "collabel", SHAPE_LABELS[sh]));
    for (const style of STYLES) {
      const label = el("div", "rowlabel", STYLE_LABELS[style]);
      label.append(el("small", "", STYLE_NOTES[style]));
      g.append(label);
      for (const sh of SHAPES) {
        const card = {
          type: "custom:controlfreak-picture",
          scene: "overview",
          shape: sh,
          style,
          pumps: { pool: "fan.demo_pump", spa: "fan.demo_pump", falls: "fan.demo_pump", deck: "fan.demo_pump", bub: "fan.demo_pump" },
          lights: { pool: "light.demo_blue", spa: "light.demo_magenta", falls: "light.demo_white" },
          spillover: "sensor.demo_mode",
        };
        g.append(pictureEl(card, { ...demo, themes: { darkMode: dark } }));
      }
    }
    main.append(g);
    document.getElementById("meta").textContent = `shape: ${shape} · ${STYLES.length} styles × ${SHAPES.length} shapes`;
  }

  if (decksSheet) {
    // The deck contact sheet: styles down, finishes across, the default shape, every part running.
    const dark = decksSheet === "night";
    const g = el("div", `sheet decks${dark ? " night" : ""}`);
    g.append(el("div", "collabel", dark ? "night" : "day"));
    for (const d of DECKS) g.append(el("div", "collabel", DECK_LABELS[d]));
    for (const style of STYLES) {
      const label = el("div", "rowlabel", STYLE_LABELS[style]);
      label.append(el("small", "", STYLE_NOTES[style]));
      g.append(label);
      for (const d of DECKS) {
        const card = {
          type: "custom:controlfreak-picture",
          scene: "overview",
          style,
          deck: d,
          pumps: { pool: "fan.demo_pump", spa: "fan.demo_pump", falls: "fan.demo_pump", deck: "fan.demo_pump", bub: "fan.demo_pump" },
          lights: { pool: "light.demo_blue", spa: "light.demo_magenta", falls: "light.demo_white" },
          spillover: "sensor.demo_mode",
        };
        g.append(pictureEl(card, { ...demo, themes: { darkMode: dark } }));
      }
    }
    main.append(g);
    document.getElementById("meta").textContent = `shape: ${shape} · ${STYLES.length} styles × ${DECKS.length} decks`;
  }

  if (shape === "pictures") {
    for (const dark of [false, true]) {
      const g = el("div", `gallery${dark ? " night" : ""}`);
      g.append(el("div", "heading", dark ? "Every scene at night" : "Every scene by day"));
      SCENES.forEach((scene, i) => {
        const card = { type: "custom:controlfreak-picture", scene, pump: "fan.demo_pump", light: lights[i] };
        if (scene === "spa") card.spillover = "sensor.demo_mode";
        const cell = el("div");
        cell.append(pictureEl(card, { ...demo, themes: { darkMode: dark } }));
        cell.append(el("div", "caption", `${scene} · pump 60% · ${demo.states[lights[i]].attributes.effect}`));
        g.append(cell);
      });
      main.append(g);
    }
  }

  // Ready once every picture has drawn a frame (ResizeObserver fires after layout).
  const pics = [...document.querySelectorAll("controlfreak-picture")];
  const deadline = performance.now() + 8000;
  while (pics.some((p) => p.frames === 0) && performance.now() < deadline) {
    await new Promise((r) => requestAnimationFrame(r));
  }
  await new Promise((r) => requestAnimationFrame(r));
  const undrawn = pics.filter((p) => p.frames === 0).length;
  if (undrawn) window.__harnessErrors.push(`${undrawn} picture card(s) never drew a frame`);
  if (window.__harnessErrors.length) {
    main.append(el("div", "error", window.__harnessErrors.join("\n")));
    document.body.dataset.rendered = "error";
  } else {
    document.body.dataset.rendered = "true";
  }
</script>
</body>
</html>
