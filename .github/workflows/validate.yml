name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS action
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv venv -p 3.14 && uv pip install -r requirements_test.txt
      - run: uv run --no-project ruff check .
      - run: uv run --no-project pytest -q

  strategy:
    name: dashboard strategy (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/frontend/*.test.mjs

  render:
    name: dashboard render check (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx -y playwright@1.64.0 install --with-deps chromium
      - name: Screenshot every fixture shape
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 1
          mkdir -p render
          for shape in full-pool lighting-only valves-skimmers empty; do
            npx -y playwright@1.64.0 screenshot --full-page --viewport-size=1280,800 \
              --wait-for-selector='body[data-rendered]' --timeout=20000 \
              "http://127.0.0.1:8765/tests/frontend/harness.html?shape=$shape" "render/$shape.png"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-render
          path: render/
