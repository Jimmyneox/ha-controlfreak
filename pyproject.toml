[project]
name = "ha-controlfreak"
version = "0.1.0"
description = "Unofficial Home Assistant integration for the Control Freak pool controller (local MQTT-over-WebSockets + REST)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component>=0.13.367",
    "aiomqtt>=2.5.0",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "C4"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "PLR0915", "RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.controlfreak"]
combine-as-imports = true
